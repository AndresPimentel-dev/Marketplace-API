apiVersion: 5.0

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090  # Apunta al contenedor de Prometheus que definimos antes
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100        # Apunta al contenedor de Loki para los logs